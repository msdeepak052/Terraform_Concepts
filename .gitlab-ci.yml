# Terraform practice pipeline — GitLab CI
#
# Usage: only ever triggered via the GitLab web UI ("Run pipeline").
# Before clicking Run, set the TF_DIR variable in the "Run pipeline" form
# to whichever question folder you're currently practicing, e.g.:
#   Terraform_Practise/16.Practise_Sets/Q2
# Nothing else in this file, and nothing in the .tf files, needs to change
# between questions — the S3 state key is derived from TF_DIR at init time.
#
# Flow: init (manual) -> validate -> fmt -> plan (all automatic once
# started) -> apply (manual) -> destroy (manual). apply/destroy are a hard
# manual gate on purpose — this pipeline will never auto-apply or
# auto-destroy real infrastructure.

stages:
  - init
  - validate
  - fmt
  - plan
  - apply
  - destroy

workflow:
  rules:
    # Only ever create a pipeline from a manual "Run pipeline" click in the
    # GitLab UI — never on a git push or merge request event. The explicit
    # `when: never` fallback is required: without it, some pipeline sources
    # can still slip through as an implicit default.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

variables:
  TF_DIR: "Terraform_Practise/16.Practise_Sets/Q5"   # <-- override per run
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

default:
  image:
    name: hashicorp/terraform:1.10
    # The image's own ENTRYPOINT is the terraform binary itself, which
    # swallows GitLab's `sh -c "<script>"` invocation (producing errors like
    # `Terraform has no command named "sh"`). Clearing it lets GitLab run
    # its shell wrapper inside the container as normal.
    entrypoint: [""]
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY come from GitLab CI/CD
  # variables (Settings > CI/CD > Variables — masked, and Protected if this
  # only ever runs against a protected branch). They're injected as env
  # vars automatically; Terraform's AWS provider picks them up on its own,
  # nothing to export here.
  before_script:
    - cd "${TF_DIR}"

# Hidden templates (not run directly — pulled into real jobs via !reference)
.tf_init_full:
  script:
    # bucket/region/encrypt/use_lockfile are already hardcoded in each
    # question's providers.tf backend block — only `key` is left out of
    # that block (on purpose, so the same block works for every question),
    # so `key` is the only thing that needs to come from the CLI here.
    - terraform init -reconfigure -backend-config="key=${TF_DIR}/terraform.tfstate"

.tf_init_offline:
  script:
    # validate doesn't need the S3 backend or AWS credentials at all
    - terraform init -backend=false

tf-init:
  stage: init
  when: manual
  # Manual jobs default to allow_failure: true, which means GitLab does NOT
  # wait for them — later stages start immediately even though this job is
  # still sitting untriggered. allow_failure: false makes it a real blocking
  # gate: validate/fmt/plan won't start until this is clicked and succeeds.
  allow_failure: false
  script:
    - !reference [.tf_init_full, script]

tf-validate:
  stage: validate
  script:
    - !reference [.tf_init_offline, script]
    - terraform validate
  needs:
    - tf-init

tf-fmt:
  stage: fmt
  script:
    - terraform fmt -check
  needs:
    - tf-validate

tf-plan:
  stage: plan
  script:
    - !reference [.tf_init_full, script]
    - terraform plan -out=tfplan
  artifacts:
    name: "tfplan-$CI_PIPELINE_ID"
    paths:
      - ${TF_DIR}/tfplan
    expire_in: 3 days
  needs:
    - tf-fmt

tf-apply:
  stage: apply
  when: manual
  allow_failure: false
  script:
    - !reference [.tf_init_full, script]
    - terraform apply -auto-approve tfplan
  needs:
    - tf-plan

tf-destroy:
  stage: destroy
  when: manual
  allow_failure: false
  script:
    - !reference [.tf_init_full, script]
    - terraform destroy -auto-approve
  needs:
    - tf-apply
